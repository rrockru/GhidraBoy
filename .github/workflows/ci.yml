name: ci
on: [push, pull_request, workflow_dispatch]

env:
  GHIDRA_INSTALL_DIR: /home/runner/ghidra

jobs:
  build_and_test:
    name: Build + test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - ghidra_version: "12.0"
            ghidra_build_date: "20251208"
            ghidra_sha256: "af43e8cfb2fa4490cf6020c3a2bde25c159d83f45236a0542688a024e8fc1941"
          - ghidra_version: "12.0.1"
            ghidra_build_date: "20260115"
            ghidra_sha256: "85bd2990945f3a78df4d1e09f1bb1f40ab77be3bac62c6e7678900788c7f0f41"    
    env:
      GHIDRA_VERSION: ${{ matrix.ghidra_version }}
      GHIDRA_BUILD_DATE: ${{ matrix.ghidra_build_date }}
      GHIDRA_SHA256: ${{ matrix.ghidra_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - name: Install Ghidra
        run: .github/scripts/install_ghidra.sh
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: GhidraBoy_Ghidra_${{ matrix.ghidra_version }}
          path: build/distributions/*_GhidraBoy.zip
          if-no-files-found: 'error'
  release:
    if: github.ref_type == 'tag'
    name: Create draft release
    runs-on: ubuntu-latest
    needs: build_and_test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Create release and upload distribution
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create --verify-tag --generate-notes --draft "${{ github.ref_name }}"
          gh release upload "${{ github.ref_name }}" GhidraBoy_Ghidra_*/*.zip
